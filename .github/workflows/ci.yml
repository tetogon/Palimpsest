name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rs
      - run: cargo test --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file core-rs/Cargo.lock

  kotlin-reference:
    name: Kotlin reference core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test --console=plain

  android:
    name: Android release build
    runs-on: ubuntu-latest
    needs: rust-core
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rs
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      # Without keystore.properties the release APK is unsigned: this checks the build. The
      # debug APK, signed with the runner's throwaway key, is the one to try on a phone.
      - run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

  reproducible:
    name: Reproducible release APK
    runs-on: ubuntu-latest
    needs: android
    env:
      NDK_VERSION: 27.2.12479018
    # The release APK built again from scratch, in another folder, with another JDK and another
    # cargo home, has to come out byte for byte the same as the one from the android job.
    steps:
      - uses: actions/checkout@v4
        with:
          path: elsewhere/palimpsest-src
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build
        working-directory: elsewhere/palimpsest-src
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: ./gradlew :app:assembleRelease --no-build-cache --console=plain
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: first
      - name: Compare
        run: |
          a=first/release/app-release-unsigned.apk
          b=elsewhere/palimpsest-src/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum "$a" "$b"
          if ! cmp -s "$a" "$b"; then
            mkdir ua ub && unzip -q "$a" -d ua && unzip -q "$b" -d ub
            diff -rq ua ub || true
            echo "::error::the release APK is not reproducible"
            exit 1
          fi
