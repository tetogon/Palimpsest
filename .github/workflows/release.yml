name: Release draft

# Pushing a tag v1.2.3 builds the universal APK without a signature and opens a draft
# release with it. The release key never comes here: the APK is signed offline before the
# draft is published. GitHub adds the source code archives to the release by itself.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Unsigned APK and draft release
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-13
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core-rs
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-ndk@4.1.2
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The open-source cache; the default one in v6 is proprietary.
          cache-provider: basic
      - name: Tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but app/build.gradle.kts says versionName $version"
            exit 1
          fi
      - name: Build
        # No keystore.properties here, so the release APK comes out unsigned.
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease --console=plain
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="palimpsest-${GITHUB_REF_NAME}-unsigned.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
          sha256sum "$apk"
          # --target: if the tag is missing on GitHub by now (moved or deleted meanwhile), gh makes it
          # on the commit this APK was built from instead of giving up.
          gh release create "$GITHUB_REF_NAME" "$apk" --draft --generate-notes --title "Palimpsest $GITHUB_REF_NAME" --target "$GITHUB_SHA"
