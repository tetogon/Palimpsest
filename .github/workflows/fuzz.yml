name: Fuzz

# libFuzzer on the core's parsers and on whole vaults built from fuzzed plaintexts
# (core-rs/src/fuzzing.rs). A minute per target on every push to main, 25 minutes once a day.
# The corpus is kept in the Actions cache and grows from run to run; a crash leaves its input
# as an artifact, to be turned into a regular test.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Fuzz harness on stable
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core-rs
      - run: cargo test --locked --features fuzzing --lib fuzzing
      - name: Seeds
        run: FUZZ_SEED_DIR="$PWD/fuzz/seeds" cargo test --locked --features fuzzing --lib write_fuzz_seeds -- --ignored
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-seeds
          path: core-rs/fuzz/seeds

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: harness
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [tlv, op, frame, attachment, vault]
    defaults:
      run:
        working-directory: core-rs
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && 1500 || 60 }}
      # Every run writes two small container files; keep them in memory.
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly branch, 2026-11-13
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-seeds
          path: core-rs/fuzz/seeds
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core-rs/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Run
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}" "fuzz/seeds/${{ matrix.target }}"
          # The prebuilt cargo-fuzz is a musl binary and would default to musl, where ASan
          # does not work: build for the runner's own glibc target.
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            "fuzz/corpus/${{ matrix.target }}" "fuzz/seeds/${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_PER_TARGET" -max_len=65536 -timeout=10 -rss_limit_mb=2048
      - name: Crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: core-rs/fuzz/artifacts/${{ matrix.target }}
